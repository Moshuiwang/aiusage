[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-usage-widget"
version = "0.1.0"
description = "Local collector for AI coding agent usage summaries."
requires-python = ">=3.9"

[project.scripts]
ai-usage-widget = "ai_usage_widget.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

