name = "aiusage-native-readonly-local"
main = "src/index.ts"
compatibility_date = "2026-06-21"
workers_dev = false

[vars]
AIUSAGE_TOKEN = "contract-test-token"
AIUSAGE_TIMEZONE = "Asia/Shanghai"

[[d1_databases]]
binding = "AIUSAGE_DB"
database_name = "aiusage-native-readonly-local-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../migrations"
