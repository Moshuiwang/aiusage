name = "aiusage-api"
main = "src/index.ts"
compatibility_date = "2026-06-21"
workers_dev = false

[vars]
AIUSAGE_TIMEZONE = "Asia/Shanghai"
AIUSAGE_BACKEND_MODE = "native_d1_production"

[triggers]
# Cloudflare cron uses UTC; these run at 03:17 Asia/Shanghai and on the first
# day of each month at 02:23 Asia/Shanghai.
crons = ["17 19 * * *", "23 18 1 * *"]

[[routes]]
pattern = "aiusage.chunbai.com/*"
zone_name = "chunbai.com"

[[d1_databases]]
binding = "AIUSAGE_DB"
database_name = "aiusage-prod-db"
database_id = "be19e4de-4fa3-446c-8028-0d31ff0bb9f2"
migrations_dir = "../migrations"

[[r2_buckets]]
binding = "AIUSAGE_BACKUPS"
bucket_name = "aiusage-backups"
