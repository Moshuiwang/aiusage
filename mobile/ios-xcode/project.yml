name: AIUsageMobile
options:
  bundleIdPrefix: com.wangzhipeng.aiusage
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    DEVELOPMENT_TEAM: HL4BQ6T4HU
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  AIUsageMobile:
    path: ../ios
targets:
  AIUsageMobileApp:
    type: application
    platform: iOS
    dependencies:
      - package: AIUsageMobile
        product: AIUsageMobileCore
      - target: AIUsageMobileWidgetExtension
        embed: true
      - target: AIUsageWatchApp
        embed: true
    sources:
      - path: Sources/AIUsageMobileApp
      - path: Resources/Assets.xcassets
      - path: Resources/mobile-summary.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhipeng.aiusage.mobile
        TARGETED_DEVICE_FAMILY: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    entitlements:
      path: Config/AIUsageMobileApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wangzhipeng.aiusage
    info:
      path: Config/AIUsageMobileApp-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        AIUsageAPIBaseURL: "$(AI_USAGE_API_BASE_URL)"
        AIUsageAPIToken: "$(AI_USAGE_API_TOKEN)"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  AIUsageMobileWidgetExtension:
    type: app-extension
    platform: iOS
    dependencies:
      - package: AIUsageMobile
        product: AIUsageMobileCore
    sources:
      - path: Sources/AIUsageMobileWidgetExtension
      - path: Resources/mobile-summary.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhipeng.aiusage.mobile.widget
        TARGETED_DEVICE_FAMILY: 1
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    entitlements:
      path: Config/AIUsageMobileWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wangzhipeng.aiusage
    info:
      path: Config/AIUsageMobileWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  AIUsageWatchApp:
    type: application
    platform: watchOS
    dependencies:
      - target: AIUsageWatchWidgetExtension
        embed: true
    sources:
      - path: Sources/AIUsageWatchApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhipeng.aiusage.mobile.watch
        TARGETED_DEVICE_FAMILY: 4
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    entitlements:
      path: Config/AIUsageWatchApp.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wangzhipeng.aiusage.watch
    info:
      path: Config/AIUsageWatchApp-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKCompanionAppBundleIdentifier: com.wangzhipeng.aiusage.mobile
        WKApplication: true

  AIUsageWatchWidgetExtension:
    type: app-extension
    platform: watchOS
    sources:
      - path: Sources/AIUsageWatchWidgetExtension
      - path: Sources/AIUsageWatchApp/WatchSummaryStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wangzhipeng.aiusage.mobile.watch.widget
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    entitlements:
      path: Config/AIUsageWatchWidgetExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.wangzhipeng.aiusage.watch
    info:
      path: Config/AIUsageWatchWidgetExtension-Info.plist
      properties:
        CFBundleDisplayName: AI Usage
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
